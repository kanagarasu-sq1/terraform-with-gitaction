```yaml
name: Terraform Destroy Selected Resource

on:
  workflow_dispatch:
    inputs:
      resource_address:
        description: "Terraform resource address (example: aws_vpc.main)"
        required: true
        type: string
      confirm_destroy:
        description: "Select DESTROY to confirm"
        required: true
        type: choice
        options:
          - NO
          - DESTROY
        default: NO

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"

jobs:
  destroy-resource:
    name: Destroy Selected Resource
    runs-on: ubuntu-latest
    if: inputs.confirm_destroy == 'DESTROY'
    environment: production

    concurrency:
      group: terraform-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::704475326985:role/GitHubTerraformDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubTerraformDestroyResource

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Selected Resource
        env:
          RESOURCE_ADDRESS: ${{ inputs.resource_address }}
        run: |
          terraform plan -destroy \
            -target="$RESOURCE_ADDRESS" \
            -out=destroy.tfplan
          terraform apply -auto-approve destroy.tfplan
```
